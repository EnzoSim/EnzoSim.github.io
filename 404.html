<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#ffffff" />
    <title>Page not found · Enzo Simier</title>
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      /* Same type, colours and pills as the main site (react-site/src/index.css). */
      :root {
        color-scheme: light;
        --ink: #242424;
        --body: #555;
        --muted: #6f6f6f;
        --blue-dark: #155b7c;
        --blue-wash: rgb(40 122 158 / 11%);
      }
      * { box-sizing: border-box; }
      body {
        display: grid;
        min-height: 100svh;
        margin: 0;
        place-items: center;
        color: var(--body);
        background: #fff;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Helvetica Neue", Arial, sans-serif;
        font-size: 0.94rem;
        line-height: 1.55;
        -webkit-font-smoothing: antialiased;
      }
      main { max-width: 28rem; padding: 2rem 1.25rem 3rem; }
      .name { display: inline-block; margin-bottom: 2rem; color: var(--ink); font-size: 1.35rem; font-weight: 620; letter-spacing: -0.03em; text-decoration: none; }
      h1 { margin: 0 0 0.75rem; color: var(--ink); font-size: 1.8rem; font-weight: 620; letter-spacing: -0.035em; line-height: 1.15; }
      p { margin: 0; }
      nav { display: flex; margin-top: 1.5rem; flex-wrap: wrap; gap: 0.45rem; }
      nav a {
        display: inline-flex;
        min-height: 2.15rem;
        padding: 0.32rem 0.78rem;
        align-items: center;
        color: var(--muted);
        background: #fff;
        border: 1px solid rgb(40 122 158 / 18%);
        border-radius: 999px;
        font-size: 0.9rem;
        text-decoration: none;
      }
      nav a:first-child { color: var(--blue-dark); background: var(--blue-wash); border-color: rgb(40 122 158 / 34%); }
      nav a:hover { color: var(--ink); border-color: rgb(40 122 158 / 30%); }
      a:focus-visible { outline: 2px solid var(--blue-dark); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <a class="name" href="/">Enzo Simier</a>
      <h1>Page not found</h1>
      <p>This address does not exist on the site. Everything is reachable from these three pages.</p>
      <nav aria-label="Site pages">
        <a href="/">About</a>
        <a href="/projects/">Projects</a>
        <a href="/reading/">Reading</a>
      </nav>
    </main>
  </body>
</html>
