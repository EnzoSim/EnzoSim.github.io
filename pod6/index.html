<!-- The dashboard, full screen. It runs on Railway; this page is its only address: the frame takes this page's
     view (?v=1&view=…), and this address follows the view as it changes, so it can be shared as it is.
     Unlisted: no link from the site, not in the sitemap, noindex. -->
<iframe id="dashboard" title="Pod 6 cost explorer: an independent analysis" allow="clipboard-write"></iframe>
<script>
  (function () {
    var DASH = "https://dashboard-production-94ec.up.railway.app";
    document.getElementById("dashboard").src = DASH + "/" + location.search;
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (event.origin !== DASH || !data || data.type !== "pod6:url") return;
      var search = String(data.search || "");
      if (!/^[\w.%=&+~-]*$/.test(search)) return;
      try { history.replaceState(null, "", location.pathname + (search ? "?" + search : "")); } catch (error) { /* the address stays as it is */ }
    });
  })();
</script>
</body>
