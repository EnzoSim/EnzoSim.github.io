<body>
<!-- The dashboard, full screen. It runs on Railway; this page is its only address: the frame takes this page's
     plan (?v=1&d=…), and this address follows the plan as it changes, so it can be shared as it is.
     Unlisted: not linked from the site, not in the sitemap, noindex. -->
<iframe id="dashboard" title="Demand and inventory plan, Altitude Sports case study" allow="clipboard-write"></iframe>
<script>
  (function () {
    var DASH = "https://dashboard-production-6cae.up.railway.app";
    document.getElementById("dashboard").src = DASH + "/" + location.search;
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (event.origin !== DASH || !data || data.type !== "altitude:url") return;
      var search = String(data.search || "");
      if (!/^[\w.%=&+~-]*$/.test(search)) return;
      try { history.replaceState(null, "", location.pathname + (search ? "?" + search : "")); } catch (error) { /* keep the address */ }
    });
  })();
</script>
</body>
