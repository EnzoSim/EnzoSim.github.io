<iframe id="dashboard" title="Urée, printemps 2027 : étude de cas d’approvisionnement" allow="clipboard-write"></iframe>
<script>
  (function () {
    var DASH = "https://dashboard-production-9ab5.up.railway.app";
    document.getElementById("dashboard").src = DASH + "/" + location.search;
    window.addEventListener("message", function (event) {
      var data = event.data;
      if (event.origin !== DASH || !data || data.type !== "uree:url") return;
      var search = String(data.search || "");
      if (!/^[\w.%=&+~-]*$/.test(search)) return;
      try { history.replaceState(null, "", location.pathname + (search ? "?" + search : "")); } catch (error) { /* l'adresse reste telle quelle */ }
    });
  })();
</script>
